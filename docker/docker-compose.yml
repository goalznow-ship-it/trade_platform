# Trade Platform — Production-grade Docker Compose
#
# Architecture:
#   - nginx is the ONLY public ingress (ports 80/443 on host)
#   - postgres/redis/backend/frontend are internal-only
#   - Separate "migrator" service runs alembic before app starts
#   - ML training runs in its own profile (not with live app)
#   - All services have resource limits, init, healthchecks
#
# Required env vars (no defaults for sensitive ones):
#   POSTGRES_PASSWORD, SECRET_KEY, EXCHANGE_ENCRYPTION_KEY, CORS_ORIGINS

x-project-env: &project-env
  - path: ../.env
    required: false

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-default-security: &default-security
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE  # only for services that bind privileged ports

services:
  # ── DATA LAYER (internal-only) ───────────────────────────────────
  postgres:
    image: postgres:16.4-alpine
    env_file: *project-env
    environment:
      # No default password — must be set in .env
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      # Tune for crypto trading workload
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # Internal-only: NO host port exposure. Admin access via SSH tunnel.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-backup:/backup
    restart: unless-stopped
    <<: *default-security
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    shm_size: 1gb

  redis:
    image: redis:7.4-alpine
    # No public port. Internal only.
    expose:
      - "6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped
    <<: *default-security
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ── MIGRATION RUNNER (runs once, before backend starts) ─────────
  migrator:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: *project-env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    <<: *default-security
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── BACKEND (internal-only, nginx is the ingress) ────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # Internal-only access through Docker network. Nginx reaches it via
    # http://backend:8000. No direct host access.
    expose:
      - "8000"
    env_file: *project-env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      ENABLE_BACKGROUND_SERVICES: ${ENABLE_BACKGROUND_SERVICES:-true}
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ml_models:/app/app/models_store
    <<: *default-security
    logging: *default-logging
    # Multi-worker gunicorn with recycle to mitigate memory leaks
    command: >
      sh -c "exec gunicorn -w ${GUNICORN_WORKERS:-2}
             -k uvicorn.workers.UvicornWorker
             --timeout ${GUNICORN_TIMEOUT:-120}
             --graceful-timeout 30
             --keep-alive 5
             --max-requests 1000
             --max-requests-jitter 100
             app.main:app
             --bind 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    stop_grace_period: 60s

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >
      celery -A app.workers worker
        --loglevel=info
        --concurrency=${CELERY_CONCURRENCY:-2}
        --max-tasks-per-child=100
        --without-mingle
        --without-gossip
    env_file: *project-env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    <<: *default-security
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers inspect ping -d celery@$$HOSTNAME --timeout=10 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >
      celery -A app.workers beat
        --loglevel=info
        --schedule=/var/lib/celery/celerybeat-schedule
    env_file: *project-env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    <<: *default-security
    logging: *default-logging
    volumes:
      - celery_beat_data:/var/lib/celery
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/celery/celerybeat-schedule || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ── FRONTEND (internal-only) ────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL must be set}
    # Internal-only. Nginx serves it.
    expose:
      - "3000"
    env_file: *project-env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    <<: *default-security
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M

  # ── NGINX (THE ONLY PUBLIC INGRESS) ─────────────────────────────
  nginx:
    image: nginx:1.27.3-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONFIG:-../nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../nginx/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M

  # ── CERTBOT (production profile only) ───────────────────────────
  certbot:
    image: certbot/certbot:v3.0.4
    profiles: ["production"]
    volumes:
      - ../nginx/letsencrypt:/etc/letsencrypt
      - ../nginx/ssl:/etc/nginx/ssl
      - certbot_www:/var/www/certbot
    # Run once on deploy + every 12h to renew near-expiry certs.
    # Post-hook signals nginx to reload.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --post-hook \"nginx -s reload || true\"; sleep 12h & wait $$!; done;'"
    depends_on:
      - nginx
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ── ML TRAINING (separate profile, not run with live app) ───────
  ml_trainer:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        INSTALL_ML_DEPS: "true"
    profiles: ["ml-training"]
    env_file: *project-env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ml_models:/app/app/models_store
      - ml_training_cache:/app/training_cache
    command: ["python", "-m", "app.services.ml.training.train_script"]
    restart: "no"
    <<: *default-security
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

volumes:
  postgres_data:
  redis_data:
  ml_models:
  celery_beat_data:
  nginx_logs:
  certbot_www:
  ml_training_cache:

[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    asyncio: asyncio tests
    slow: slow tests
# Phase 6 coverage: always include the ``--cov`` report so a
# regression in coverage fails the suite. ``--cov-fail-under=20``
# pins a minimum line-coverage floor. The 20% baseline reflects
# the actual coverage of the full test suite — most uncovered
# lines are auth fixtures, MLflow glue, and SKHY analysis
# branches that need real Binance data. Tighten the threshold
# as those modules get covered in Phase 7.
addopts = --cov=app --cov-report=term-missing --cov-fail-under=20
